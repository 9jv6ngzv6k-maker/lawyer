<style>

@font-face{font-family:'Onest';font-style:normal;font-weight:500;src:url(../assets/fonts/onest-normal-500-e8d08684.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'Onest';font-style:normal;font-weight:500;src:url(../assets/fonts/onest-normal-500-9db4c793.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:400;src:url(../assets/fonts/jetbrains-mono-normal-400-46a14c9f.woff2) format('woff2');unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
@font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:400;src:url(../assets/fonts/jetbrains-mono-normal-400-2530f568.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
:root{--paper:#F3F5F8;--ink:#0E1B2C;--ink-2:#3B4757;--steel:#2F5F8A}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:var(--paper);color:var(--ink);font-family:'Onest',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.card{position:relative;width:1200px;height:630px;padding:64px 72px 56px;display:flex;flex-direction:column;
  background:radial-gradient(900px 520px at 88% 30%,#E3E9F0 0,rgba(227,233,240,0) 70%),var(--paper)}
.card::after{content:"";position:absolute;inset:24px;border:1px solid rgba(14,27,44,.12);pointer-events:none}
.brand{display:flex;align-items:center;gap:16px}
.brand svg{width:52px;height:52px}
.word{font-family:'Playfair Display',Georgia,serif;font-size:31px;line-height:1}
.word em{color:var(--steel)}
.tag{margin-top:48px;font-family:'JetBrains Mono',monospace;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.tag b{color:var(--steel);font-weight:400}
h1{margin-top:18px;font-family:'Playfair Display',Georgia,serif;font-weight:400;font-size:76px;line-height:1.02;letter-spacing:-.018em;max-width:900px}
h1 em{font-style:italic}
.strike{position:relative;white-space:nowrap}
.strike svg{position:absolute;left:-4%;top:18%;width:108%;height:60%;overflow:visible}
.strike path{fill:none;stroke:var(--steel);stroke-width:5;stroke-linecap:round;vector-effect:non-scaling-stroke}
.foot{margin-top:auto;display:flex;align-items:center;gap:28px;font-size:26px;font-weight:500;letter-spacing:.01em}
.foot .sep{width:1px;height:28px;background:rgba(14,27,44,.25)}
.foot .muted{color:var(--steel)}
.mark{position:absolute;right:64px;bottom:40px;width:250px;height:250px;color:var(--steel);opacity:.13}
</style>
</head>
